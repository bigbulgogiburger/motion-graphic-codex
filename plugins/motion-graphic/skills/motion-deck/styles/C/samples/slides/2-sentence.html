<section data-sid="sentence" data-steps="2" class="c-roles">
  <div class="flip r-cap" data-flip="L0 | L1 | L1" data-enter="mask" data-enter-delay="380" data-stagger="40" data-dur="800" data-out="up">
    <template data-name="L0">
      <p><span data-k="h0" data-enter-dur="600">사람이</span> <span data-k="w" data-enter-dur="600">찾고,</span></p>
      <p><span data-k="a0" data-enter-dur="600">AI<i class="kx"></i>가</span> <span data-k="help" data-enter-dur="600">거든다.</span></p>
    </template>
    <template data-name="L1">
      <p><span data-k="a1" data-delay="120">AI<i class="kx"></i>가</span> <span data-k="w">찾고,</span></p>
      <p><span data-k="h1" data-delay="200">사람은</span> <span data-k="dec" data-delay="260">고른다.</span></p>
    </template>
  </div>

  <div class="r-bar"></div>
  <i class="r-ai dot"></i>
  <div class="r-hx h1"><div class="r-hy"><i class="r-hs dia"></i></div></div>
  <div class="r-hx h2"><div class="r-hy"><i class="r-hs dia"></i></div></div>
  <div class="r-hx h3"><div class="r-hy"><i class="r-hs dia"></i></div></div>

  <p class="r-tag tag-h0" data-until="0">사람</p>
  <p class="r-tag tag-h1" data-at="1" data-until="1" data-fx="fade" style="--delay:.6s; --dur:.45s">사람</p>
  <p class="r-tag tag-ai">AI</p>
  <p class="r-verb v1" data-at="2" data-fx="rise" style="--delay:.5s; --dur:.5s">고른다</p>
  <p class="r-verb v2" data-at="2" data-fx="rise" style="--delay:.55s; --dur:.5s">고친다</p>
  <p class="r-verb v3" data-at="2" data-fx="rise" style="--delay:.6s; --dur:.5s">보낸다</p>
  <aside class="notes">(스타일 샘플 — 가상 발표) 처음에는 상담원이 답을 찾고, AI는 옆에서 거드는 정도였습니다. (클릭) 지금은 반대입니다. AI가 먼저 찾아 오고, 상담원은 그중에서 고릅니다. (클릭) 그리고 고쳐서 보냅니다. 보내는 버튼은 여전히 사람이 누릅니다.</aside>
</section>
